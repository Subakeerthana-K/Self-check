<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

:root[data-theme="light"] {
  --bg: #FAFAF8;
  --bg-2: #F2F1EC;
  --card: #FFFFFF;
  --card-muted: #F7F6F2;
  --border: #E7E5DE;
  --text: #1C1B19;
  --text-2: #716F68;
  --text-3: #A19E95;
  --accent: #2F6F5E;
  --accent-ink: #1F4B40;
  --accent-soft: #E4EFEC;
  --accent-contrast: #FFFFFF;
  --warn: #A9662A;
  --warn-soft: #F5E9D8;
  --danger: #A83E3E;
  --danger-soft: #F5E1DF;
  --success: #2F6F5E;
  --success-soft: #E4EFEC;
  --shadow-sm: 0 1px 2px rgba(28,27,25,0.05);
  --shadow-md: 0 6px 20px rgba(28,27,25,0.08);
  --shadow-lift: 0 16px 40px rgba(28,27,25,0.16);
  --overlay: rgba(20,19,17,0.42);
}
:root[data-theme="dark"] {
  --bg: #121210;
  --bg-2: #191916;
  --card: #1D1D19;
  --card-muted: #232320;
  --border: #2C2B26;
  --text: #EEEDE8;
  --text-2: #A6A49B;
  --text-3: #726F66;
  --accent: #55A98F;
  --accent-ink: #BFE6D7;
  --accent-soft: #1E2C27;
  --accent-contrast: #0D1512;
  --warn: #D5A165;
  --warn-soft: #2C2417;
  --danger: #D3837E;
  --danger-soft: #2E1D1C;
  --success: #55A98F;
  --success-soft: #1E2C27;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 6px 20px rgba(0,0,0,0.35);
  --shadow-lift: 0 20px 48px rgba(0,0,0,0.55);
  --overlay: rgba(0,0,0,0.6);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background 0.25s ease, color 0.25s ease;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
input, select, textarea { font-family: inherit; }
::selection { background: var(--accent-soft); }

@keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
@keyframes popIn { 0% { opacity: 0; transform: scale(0.85); } 60% { opacity: 1; transform: scale(1.03); } 100% { transform: scale(1); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
@keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

.app-root { width: 100%; min-height: 100vh; }
.hidden { display: none !important; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border-radius: 10px; border: 1px solid transparent; cursor: pointer;
  font-weight: 600; font-size: 14px; padding: 10px 16px;
  transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.2s ease;
  white-space: nowrap; position: relative; overflow: hidden;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--text); color: var(--bg); }
.btn-primary:hover { opacity: 0.88; transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn-accent { background: var(--accent); color: var(--accent-contrast); }
.btn-accent:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 6px 18px var(--accent-soft); }
.btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
.btn-ghost:hover { background: var(--card-muted); transform: translateY(-1px); }
.btn-subtle { background: var(--card-muted); color: var(--text-2); border-color: var(--border); }
.btn-subtle:hover { color: var(--text); transform: translateY(-1px); }
.btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
.btn-full { width: 100%; }
.btn[disabled] { opacity: 0.55; cursor: not-allowed; }
