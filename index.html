<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

:root[data-theme="light"] {
  --bg: #FAFAF8;
  --bg-2: #F2F1EC;
  --card: #FFFFFF;
  --card-muted: #F7F6F2;
  --border: #E7E5DE;
  --text: #1C1B19;
  --text-2: #716F68;
  --text-3: #A19E95;
  --accent: #2F6F5E;
  --accent-ink: #1F4B40;
  --accent-soft: #E4EFEC;
  --accent-contrast: #FFFFFF;
  --warn: #A9662A;
  --warn-soft: #F5E9D8;
  --danger: #A83E3E;
  --danger-soft: #F5E1DF;
  --success: #2F6F5E;
  --success-soft: #E4EFEC;
  --shadow-sm: 0 1px 2px rgba(28,27,25,0.05);
  --shadow-md: 0 6px 20px rgba(28,27,25,0.08);
  --shadow-lift: 0 16px 40px rgba(28,27,25,0.16);
  --overlay: rgba(20,19,17,0.42);
}
:root[data-theme="dark"] {
  --bg: #121210;
  --bg-2: #191916;
  --card: #1D1D19;
  --card-muted: #232320;
  --border: #2C2B26;
  --text: #EEEDE8;
  --text-2: #A6A49B;
  --text-3: #726F66;
  --accent: #55A98F;
  --accent-ink: #BFE6D7;
  --accent-soft: #1E2C27;
  --accent-contrast: #0D1512;
  --warn: #D5A165;
  --warn-soft: #2C2417;
  --danger: #D3837E;
  --danger-soft: #2E1D1C;
  --success: #55A98F;
  --success-soft: #1E2C27;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 6px 20px rgba(0,0,0,0.35);
  --shadow-lift: 0 20px 48px rgba(0,0,0,0.55);
  --overlay: rgba(0,0,0,0.6);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background 0.25s ease, color 0.25s ease;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
input, select, textarea { font-family: inherit; }
::selection { background: var(--accent-soft); }

@keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
@keyframes popIn { 0% { opacity: 0; transform: scale(0.85); } 60% { opacity: 1; transform: scale(1.03); } 100% { transform: scale(1); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
@keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

.app-root { width: 100%; min-height: 100vh; }
.hidden { display: none !important; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border-radius: 10px; border: 1px solid transparent; cursor: pointer;
  font-weight: 600; font-size: 14px; padding: 10px 16px;
  transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.2s ease;
  white-space: nowrap; position: relative; overflow: hidden;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--text); color: var(--bg); }
.btn-primary:hover { opacity: 0.88; transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn-accent { background: var(--accent); color: var(--accent-contrast); }
.btn-accent:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 6px 18px var(--accent-soft); }
.btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
.btn-ghost:hover { background: var(--card-muted); transform: translateY(-1px); }
.btn-subtle { background: var(--card-muted); color: var(--text-2); border-color: var(--border); }
.btn-subtle:hover { color: var(--text); transform: translateY(-1px); }
.btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
.btn-full { width: 100%; }
.btn[disabled] { opacity: 0.55; cursor: not-allowed; }

.icon-btn {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--card); color: var(--text-2); display: flex; align-items: center;
  justify-content: center; cursor: pointer; font-size: 16px; position: relative;
  transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
}
.icon-btn:hover { background: var(--card-muted); color: var(--text); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.icon-btn:active { transform: scale(0.94); }

/* ================= LOGIN ================= */
#view-login {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: var(--bg); padding: 24px; position: relative; overflow: hidden;
}
.login-card {
  width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border);
  border-radius: 18px; padding: 40px 32px; box-shadow: var(--shadow-md); position: relative; z-index: 1;
  animation: scaleIn 0.5s ease both;
}
.login-logo { font-size: 15px; font-weight: 800; letter-spacing: 0.3px; color: var(--text); margin-bottom: 28px; }
.login-logo span { color: var(--accent); }
.login-heading { font-size: 24px; font-weight: 700; margin: 0 0 8px; }
.login-sub { font-size: 14px; color: var(--text-2); margin: 0 0 28px; line-height: 1.5; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.field input {
  width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font-size: 14px; outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field input::placeholder { color: var(--text-3); }
#signInBtn { margin-top: 8px; }

/* ================= APP SHELL ================= */
#view-app { display: flex; min-height: 100vh; }

.sidebar {
  width: 232px; flex-shrink: 0; background: var(--bg-2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 20px 14px; transition: width 0.28s ease, padding 0.28s ease;
  overflow-y: auto;
}
.sidebar.collapsed { width: 76px; padding: 20px 10px; }
.sidebar-logo { font-size: 15px; font-weight: 800; padding: 4px 10px 22px; letter-spacing: 0.3px; display: flex; align-items: center; justify-content: space-between; }
.sidebar-logo span.mark { color: var(--accent); }
.sidebar.collapsed .logo-text { display: none; }

.nav-group { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 9px;
  color: var(--text-2); font-size: 14px; font-weight: 600; cursor: pointer; border: none; background: none;
  text-align: left; width: 100%; position: relative; overflow: hidden;
  transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
}
.nav-item:hover { background: var(--card-muted); color: var(--text); transform: translateX(2px); }
.nav-item.active { background: var(--accent-soft); color: var(--accent-ink); }
.nav-item.active::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 60%; border-radius: 0 3px 3px 0; background: var(--accent); }
.nav-item .ic { width: 18px; text-align: center; flex-shrink: 0; }
.sidebar.collapsed .nav-label { display: none; }
.sidebar.collapsed .nav-item { justify-content: center; }

.main {
  flex: 1; min-width: 0; padding: 28px 36px 60px; overflow-y: auto;
}
.page { animation: fadeInUp 0.35s ease both; }

.topbar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 26px; gap: 16px; flex-wrap: wrap; }
.greeting { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
.greeting-sub { font-size: 14px; color: var(--text-2); margin: 0; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--accent-contrast);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; cursor: pointer;
  border: 1px solid var(--border); transition: transform 0.15s ease, box-shadow 0.15s ease;
